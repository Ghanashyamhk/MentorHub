<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login | Mentor Platform</title>

  <link rel="stylesheet" href="css/auth.css">

  <!-- Google Identity Services -->
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>

<body>

  <div class="signup-container">

    <h2>Login</h2>

    <!-- Normal Login -->
    <form id="loginForm">

      <label>Email</label>
      <input type="email" id="loginEmail" required>

      <label>Password</label>
      <input type="password" id="loginPassword" required>

      <button type="submit">Login</button>

    </form>

    <!-- Divider -->
    <div style="
      display:flex;
      align-items:center;
      gap:10px;
      margin:20px 0;
    ">
      <hr style="flex:1;">
      <span>OR</span>
      <hr style="flex:1;">
    </div>

    <!-- Google Login -->
    <div
      id="g_id_onload"
      data-client_id="635942112385-ou5pos41r677qe610v6asiv0uid84nbk.apps.googleusercontent.com"
      data-callback="handleGoogleLogin"
      data-auto_prompt="false">
    </div>

    <div
      class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="signin_with"
      data-shape="rectangular"
      data-logo_alignment="left">
    </div>

    <div id="googleRoleBox" style="display:none; margin-top:20px;">

  <p><strong>Select your role</strong></p>

  <button type="button" id="googleStudentBtn">
    Continue as Student
  </button>

  <button type="button" id="googleMentorBtn">
    Continue as Mentor
  </button>

</div>

    <p class="link">
      Don't have an account?
      <a href="signup.html">Create one</a>
    </p>

  </div>

  <script src="js/auth.js"></script>

</body>
</html>
